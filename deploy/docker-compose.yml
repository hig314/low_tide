services:
  lowtide:
    image: nginx:alpine
    container_name: lowtide
    restart: unless-stopped
    volumes:
      # The low_tide project, copied VERBATIM (no source edits). Docroot is its
      # static/ folder; nginx.conf also serves it under /static/ (the URLs the
      # app's own page links use) and proxies /requests/ to lowtide-api.
      - ./app/static:/usr/share/nginx/html:ro
      - ./nginx.conf:/etc/nginx/conf.d/default.conf:ro
    expose:
      - "80"
    networks:
      - web_external
      - lowtide_internal

  # NMDS backend (POST /requests/NMDS from the NMDS page). Runs the app's
  # webapp.py unmodified; see api/Dockerfile. Only nginx can reach it.
  lowtide-api:
    build:
      context: .
      dockerfile: api/Dockerfile
    image: lowtide-api
    container_name: lowtide-api
    restart: unless-stopped
    volumes:
      - ./app:/app:ro
    expose:
      - "5000"
    networks:
      - lowtide_internal
    # Guardrails: the droplet's single vCPU and ~1.4GB free RAM are shared with
    # HWITW, and this endpoint is public and unauthenticated.
    cpus: 0.75
    mem_limit: 768m

# Shared reverse-proxy network owned by /opt/caddy. Caddy routes the domain and
# the reserved IP's Host header to this stack's nginx by name (lowtide:80).
# lowtide_internal is private to this stack (nginx <-> api).
networks:
  web_external:
    external: true
  lowtide_internal:
