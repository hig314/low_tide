# nginx vhost for the low_tide static app.
# Docroot is the project's static/ folder (mounted read-only). The app is fully
# client-side: index_lt.html + pre-baked sheet.js / Temp_data.js, no backend calls.
server {
    listen 80;
    server_name _;

    root /usr/share/nginx/html;
    index index_lt.html;

    # Long-lived static assets; the big data blobs (sheet.js ~2.6MB, Temp_data.js)
    # change only when download.py regenerates them.
    location / {
        try_files $uri $uri/ =404;
    }
}
