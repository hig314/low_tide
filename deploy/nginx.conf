# nginx vhost for the low_tide app.
# Docroot is the project's static/ folder (mounted read-only). The pages live at
# /static/main/index_lt.html and /static/NMDS/index_NMDS.html; their page-to-page
# links are hard-coded to /static/... (the app's Flask dev layout), so /static/X
# is served as an alias of /X. Generated data blobs (seldovia_sheet.js, ...) sit
# at the docroot top level, where the refresh cron writes them; pages load them
# via ../ so they resolve under either prefix.
# The NMDS page POSTs to /requests/NMDS, proxied to the lowtide-api container.

# Requests arrive via Caddy; take the client IP from its X-Forwarded-For so the
# rate limit below is per visitor, not one shared bucket for "Caddy".
set_real_ip_from 172.16.0.0/12;
real_ip_header X-Forwarded-For;

# NMDS fits are CPU-heavy on a 1-vCPU host shared with HWITW.
limit_req_zone $binary_remote_addr zone=nmds:1m rate=10r/m;

# Revalidate JS/HTML on every load (cheap 304s via ETag) so a handoff that
# changes a script in place is never masked by a stale browser cache.
map $uri $cache_control {
    ~*\.(js|html)$  "no-cache";
    default         "";
}

server {
    listen 80;
    server_name _;

    root /usr/share/nginx/html;
    index index_lt.html index_NMDS.html;
    # Relative Location headers: behind Caddy nginx only sees http, and an
    # absolute redirect would bounce HTTPS visitors to http://.
    absolute_redirect off;
    add_header Cache-Control $cache_control;

    # Entry point + the pre-2026-10 page URL.
    location = /              { return 302 /static/main/index_lt.html; }
    location = /index_lt.html { return 301 /static/main/index_lt.html; }

    location /static/ {
        alias /usr/share/nginx/html/;
    }

    location /requests/ {
        limit_req zone=nmds burst=5 nodelay;
        limit_req_status 429;
        client_max_body_size 1m;
        proxy_read_timeout 120s;
        # Resolve at request time (Docker DNS) so nginx starts even if the api
        # container is down, and follows it if it is recreated with a new IP.
        resolver 127.0.0.11 valid=30s;
        set $api http://lowtide-api:5000;
        proxy_pass $api;
        proxy_set_header Host $host;
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
    }

    location / {
        try_files $uri $uri/ =404;
    }
}
