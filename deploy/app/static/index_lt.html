<!DOCTYPE html>
<html>
<head>
  <meta charset="UTF-8">
  <title>Low tide data analasys</title>
  <script src="https://cdn.jsdelivr.net/npm/@svgdotjs/svg.js@3.0/dist/svg.min.js"></script>
  <!--link rel="icon" href="favicon_no16.ico"-->
  <style>
	html, body {
	  overflow-anchor: none;
	  overscroll-behavior: none;
	}
	label {
	  font-family: 'Arial', sans-serif;
	  font-size: 14px;
	}
	.noUi-tooltip {
		top: 28px;
		height: 30px;
		margin: 0px 0px;
		border: #f00 !important;
		padding: 2px 6px; 
		font-size: 14px;
		box-shadow: none;
	}
	.mouseover {
	  position: fixed;
	  pointer-events: none;
	  left: var(--mouse-x);
	  top: var(--mouse-y);
	  margin-left: 10px;
	  margin-top: 10px;
	}
	.centered {
	  position: absolute;
	  top: 50%;
	  left: 50%;
	  transform: translate(-50%, -50%);
	}

	.overlay {
	  position: fixed;
	  top: 0;
	  left: 0;
	  width: 100vw;
	  height: 100vh;
	  background-color: rgba(0, 0, 0, 0.5);
	  backdrop-filter: blur(4px);
	  
	}
	.overlay.hidden {
	  opacity: 0;
	  visibility: hidden;
	  pointer-events: none;
	}
	.popup {
	  position: fixed;
	  top: 50%;
	  left: 50%;
	  transform: translate(-50%, -50%);
	  background: white;
	  padding: 20px;
	  border-radius: 8px;
	  overflow-y: auto;
	  max-height: 100vh;
	}

	.popup.hidden {
	  display: none !important;
	}
	.grid5 {
	  display: grid;
	  grid-template-columns: 140px 26px 60px 50px 42px;
	  gap: 5px;
	  align-items: center; 
	}

  </style>
</head>
<body>
  <div id=mouseover_container class="mouseover" style="display: none; flex-direction: column; gap: 10px; background-color: #f2f2f2; border-radius: 5px; border: 1px solid #bbb; box-shadow: 0 0 8px rgba(0, 0, 0, 0.15); padding: 3px 5px;">
    <label id=mouseover0></label>
    <label id=mouseover1></label>
    <label id=mouseover2></label>
  </div>
  <div id="page-overlay" class="overlay hidden" style="z-index: 996;"></div>
  <div id=custom class="popup hidden" style="display: flex; flex-direction: column; gap: 10px; background-color: #f2f2f2; border-radius: 5px; border: 1px solid #bbb; box-shadow: 0 0 8px rgba(0, 0, 0, 0.15); padding: 3px 5px; align-items: center; z-index: 997;">
	<div id="custom_speiceis" class='grid5'></div>
	<button id="new_group" type="button" style="margin-left: 0px; background-color: #fff; border-width: thin; border-radius: 2px; flex: none; " >Add new group</button>
	<div style="display: flex; flex-direction: row; gap: 30px; align-items: center;">
	  <button id="customs_deselect" type="button" style="margin-left: 0px; background-color: #fff; border-width: thin; border-radius: 2px;" >Deselect all</button>
	  <button id="customs_select" type="button" style="margin-left: 0px; background-color: #fff; border-width: thin; border-radius: 2px;" >Select all</button>
	</div>
	<select id=customs_file_select></select>
	<input type="text" id="name" placeholder="Name">
	<button id="submit" type="button" style="margin-left: 0px; background-color: #fff; border-width: thin; border-radius: 2px; flex: none; " >Submit</button>
  </div>
  
  <div id="page-overlay2" class="overlay hidden" style="z-index: 998;"></div>
  <div id=group_name class="popup hidden" style="display: flex; flex-direction: column; gap: 10px; background-color: #f2f2f2; border-radius: 5px; border: 1px solid #bbb; box-shadow: 0 0 8px rgba(0, 0, 0, 0.15); padding: 3px 5px; align-items: center; z-index: 999;">
	<input  id="group_name_enter" type="text" placeholder="Name">
	<button id="group_submit" type="button" style="margin-left: 0px; background-color: #fff; border-width: thin; border-radius: 2px; flex: none; " >Submit</button>
  </div>
  
  <h1 style="margin-left: 550px; font-family: Helvetica; font-size: 20px;">Kachemak Bay intertidal data analysis tool</h1>
  
  <div style="display: flex; gap: 30px; align-items: flex-start; flex-direction: row;">
    <div style="display: flex; flex-direction: column; gap: 10px; align-items: center;">
	  <select id=area_select><option>Seldovia</option><option>Coastal studies</option></select>
	  <select id=file_select></select>
    </div>
    <div style="display: flex; flex-direction: column; gap: 10px; align-items: center;">
	  <p style="margin: 0;">Date range</p>
	  <div id=date_slider_holder>
		  <div id=date_slider style="width: 100px;"></div>
	  </div>
    </div>
    <div style="display: flex; flex-direction: column; gap: 10px; align-items: center;">
	  <p style="margin: 0;">Value range</p>
	  <div id=val_slider_holder>
		  <div id=val_slider style="width: 100px;"></div>
	  </div>
    </div>
    <div style="display: flex; flex-direction: column; gap: 10px; align-items: center;">
	  <p style="margin: 0;">Tide range</p>
	  <div id=tide_slider_holder>
		  <div id=tide_slider style="width: 100px;"></div>
	  </div>
    </div>
    <!-- <div style="display: flex; flex-direction: column; gap: 10px; align-items: center;">
	  <label id=mouseover0></label>
	  <label id=mouseover1></label>
	  <label id=mouseover2></label>
    </div> -->
    <div style="display: flex; flex-direction: column; gap: 10px; align-items: center;">
		<div style="display: flex; align-items: center; gap: 5px;">
		   <label for="standard_group">Requires standard group</label>
		   <input type="checkbox" id="standard_group">
		</div>
		<div style="display: flex; align-items: center; gap: 5px;">
		   <label for="show_temp">Show temparature</label>
		   <input type="checkbox" id="show_temp">
		</div>
	    <label id=surveys style="margin-left: -10px;"></label>
    </div>
    <div style="display: flex; flex-direction: column; gap: 10px; align-items: center;">
	  <div id=speicies_select></div>
	  <div style="display: flex; flex-direction: row; gap: 10px; align-items: center;">
		<button id="deselect" type="button" style="margin-left: 0px; background-color: #fff; border-width: thin; border-radius: 2px;" >Deselect all</button>
		<button id="select" type="button" style="margin-left: 0px; background-color: #fff; border-width: thin; border-radius: 2px;" >Select all</button>
	  </div>
	  <div id=category_select></div>
    </div>
    <div style="display: flex; flex-direction: column; gap: 10px; align-items: center;">
	  <div id=location_select>
	  </div>
	  <button id="no_locations" type="button" style="margin-left: 0px; background-color: #fff; border-width: thin; border-radius: 2px;" >No locations</button>
	  <button id="all_locations" type="button" style="margin-left: 0px; background-color: #fff; border-width: thin; border-radius: 2px;" >All locations</button>
    </div>
    <div style="display: flex; flex-direction: column; gap: 10px; align-items: center;">
	  <select id=visualization>
		  <option>Numbers</option>
		  <option>Percent</option>
		  <option>Percent of selected</option>
		  <option>Presence-absence</option>
		  <option>Relative to average</option>
		  <option>Percent relative to average</option>
		  <option>Percent of the way to average</option>
		  <option>Percent of the way to maximum</option>
	  </select>
	  <select id=smoothing>
		  <option>No smoothing</option>
		  <option>Smoothed low</option>
		  <option>Smoothed medium</option>
		  <option>Smoothed high</option>
	  </select>
	  <select id=scaling>
		  <option>Linear</option>
		  <option>Square-root</option>
		  <option>Logarithmic</option>
	  </select>
    </div>
    <div style="display: flex; flex-direction: column; gap: 10px; align-items: center;">
	  <select id=graph>
		  <option>Line-graph</option>
		  <option>Scatter-plot</option>
		  <option>Stacked</option>
	  </select>
	  <select id=orginaization>
		  <option>Standard</option>
		  <option>Seasonal</option>
		  <option>Locational</option>
	  </select>
    </div>
  </div>
  <div class="stack-container">
    <div id=canvas style="display: inline-block; padding-top: 9px; display: flex; flex-direction: column; align-items: center;" title=""></div>
    <div id=error style="text-align: center; color: red; font-family: Helvetica; font-size: 20px; font-weight: bold;"></div>
  </div>
  
  <script src="libs/utils.js"></script>
  <link href="libs/nouislider/nouislider.css" rel="stylesheet">
  <script src="libs/nouislider/nouislider.js"></script>
  <link href="libs/dropdownlib/dropdownlib.css" rel="stylesheet">
  <script src="libs/dropdownlib/dropdownlib.js"></script>
  
  <script src="seldovia_sheet.js"></script>
  <script src="costal_studies_sheet.js"></script>
  <script src="temp_data.js"></script>
  
  <script src="file_initalization.js"></script>
  <script src="low_tide_data_procesting.js"></script>
  <script src="low_tide_data_analasis.js"></script>
  
  
  
  <!-- <script src="test.js"></script> -->
  
  <!--script src="wxgrid_2_metrics.js"></script-->
</body>
</html>
