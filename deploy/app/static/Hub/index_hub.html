<!DOCTYPE html>
<html>
<head>
  <meta charset="UTF-8">
  <title>Low tide data analasys</title>
  <script src="https://cdn.jsdelivr.net/npm/@svgdotjs/svg.js@3.0/dist/svg.min.js"></script>
  <!--link rel="icon" href="favicon_no16.ico"-->
  <style>
	html, body {
	  overflow-anchor: none;
	  overscroll-behavior: none;
	}
	label {
	  font-family: 'Arial', sans-serif;
	  font-size: 14px;
	}
	.noUi-tooltip {
		top: 28px;
		height: 30px;
		margin: 0px 0px;
		border: #f00 !important;
		padding: 2px 6px; 
		font-size: 14px;
		box-shadow: none;
	}
	.mouseover {
	  position: fixed;
	  pointer-events: none;
	  left: var(--mouse-x);
	  top: var(--mouse-y);
	  margin-left: 10px;
	  margin-top: 10px;
	}
	.centered {
	  position: absolute;
	  top: 50%;
	  left: 50%;
	  transform: translate(-50%, -50%);
	}

	.overlay {
	  position: fixed;
	  top: 0;
	  left: 0;
	  width: 100vw;
	  height: 100vh;
	  background-color: rgba(0, 0, 0, 0.5);
	  backdrop-filter: blur(4px);
	  
	}
	.overlay.hidden {
	  opacity: 0;
	  visibility: hidden;
	  pointer-events: none;
	}
	.popup {
	  position: fixed;
	  top: 50%;
	  left: 50%;
	  transform: translate(-50%, -50%);
	  background: white;
	  padding: 20px;
	  border-radius: 8px;
	  overflow-y: auto;
	  max-height: 100vh;
	}

	.popup.hidden {
	  display: none !important;
	}
	.grid5 {
	  display: grid;
	  grid-template-columns: 140px 26px 60px 50px 42px;
	  gap: 5px;
	  align-items: center; 
	}

  </style>
</head>
<body>
  <iframe id=page style="height: 880px; width: 100%; border: 0; padding-bottom: 0px;" ></iframe>
  
  <link href="../libs/utils.css" rel="stylesheet">
  <script src="../libs/utils.js"></script>
  
  <script src="hub.js"></script>
  
  
  
  <!-- <script src="test.js"></script> -->
  
  <!--script src="wxgrid_2_metrics.js"></script-->
</body>
</html>
